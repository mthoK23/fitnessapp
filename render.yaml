services:
  - type: web
    name: fittrack
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /
    disk:
      name: fittrack-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data